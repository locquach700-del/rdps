name: Windows-Powerful-Tailscale
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Install Tailscale securely via Winget
      shell: powershell
      run: |
        # Force using the native Windows Package Manager to fetch Tailscale securely
        winget install Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements
        
        # Verify installation paths and start the background tunnel engine
        $TailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        
        # Wait until the executable becomes available in the system files
        while (!(Test-Path $TailscalePath)) { Start-Sleep -Seconds 2 }
        
        # Connect to your network mesh using your Auth Key
        $env:TAILSCALE_AUTH_KEY = "${{ secrets.TAILSCALE_AUTH_KEY }}"
        & $TailscalePath up --authkey=$env:TAILSCALE_AUTH_KEY --accept-routes
        
    - name: 2. Kich hoat Remote Desktop va Cai mat khau dang nhap
      shell: powershell
      run: |
        # Open Remote Desktop core settings
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Set absolute user credentials for your local device link
        # Password is: ChieNgamE2026!
        $Password = ConvertTo-SecureString "ChieNgamE2026!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        
    - name: 3. Duy tri may ao luon hoat dong de choi game
      shell: powershell
      run: |
        Write-Host "May ao da chay thanh cong thong qua Winget!"
        Write-Host "Hay bat ung dung Remote Desktop de ket noi qua IP Tailscale."
        # Keep runner alive for 6 hours
        Start-Sleep -Seconds 21600
