name: Windows-Powerful-Tailscale
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Extract and Run Tailscale Portable
      shell: powershell
      run: |
        # Download the official stable Tailscale zip package
        Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "tailscale.zip" -UserAgent "Mozilla/5.0"
        
        # Extract files natively
        Expand-Archive -Path "tailscale.zip" -DestinationPath "C:\Tailscale" -Force
        
        # Locate the executable folder dynamically and start the Tailscale engine background service
        $exePath = (Get-ChildItem -Path "C:\Tailscale" -Filter "tailscaled.exe" -Recurse).FullName
        Start-Process $exePath -ArgumentList "--port 41641" -NoNewWindow
        
        # Wait 3 seconds for the engine to initialize, then bring up the connection tunnel using your Auth Key
        Start-Sleep -Seconds 3
        $cliPath = (Get-ChildItem -Path "C:\Tailscale" -Filter "tailscale.exe" -Recurse).FullName
        $env:TAILSCALE_AUTH_KEY = "${{ secrets.TAILSCALE_AUTH_KEY }}"
        & $cliPath up --authkey=$env:TAILSCALE_AUTH_KEY --accept-routes
        
    - name: 2. Kich hoat Remote Desktop va Cai mat khau dang nhap
      shell: powershell
      run: |
        # Turn on native Windows Remote Desktop core
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Set absolute user password for your phone/local PC connection
        # Password is: ChieNgamE2026!
        $Password = ConvertTo-SecureString "ChieNgamE2026!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        
    - name: 3. Duy tri may ao luon hoat dong de choi game
      shell: powershell
      run: |
        Write-Host "May ao da vao mang Tailscale thanh cong!"
        Write-Host "Hay bat ung dung Remote Desktop de ket noi."
        # Keep runner alive for 6 hours
        Start-Sleep -Seconds 21600
